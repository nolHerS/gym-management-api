springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    default-model-expand-depth: 1
    default-models-expand-depth: 1
    try-it-out-enabled: true
  packages-to-scan: com.imanol.gym

# Credenciales fijas para entorno local / desarrollo
spring:
  security:
    user:
      name: admin
      password: adminpass
      roles: ADMIN

